<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Musica">
<title>Musica</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f6f5fb;--fg:#1d1736;--dim:#6a6485;--card:#fff;--acc:#5b3df5;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#17122b;--fg:#f1eefc;--dim:#a9a2c8;--card:#241d42;--acc:#a592ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px ui-rounded,-apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(190px + env(safe-area-inset-bottom))}
h1{font-size:34px;margin:20px 0 4px}
p{color:var(--dim);margin:4px 0 16px}
button,.btn{font:inherit;border:0;background:none;color:inherit;min-height:44px;cursor:pointer}
.btn{display:block;background:var(--acc);color:var(--bg);border-radius:12px;padding:12px;text-align:center;font-weight:600}
input[type=search]{width:100%;font:inherit;padding:12px;margin:12px 0;border:0;border-radius:12px;background:var(--card);color:var(--fg)}
ul{list-style:none;padding:0;margin:0}
li{display:flex;align-items:center}
.song{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;padding:6px 0}
.cover{width:48px;height:48px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px}
.txt{min-width:0}
.txt b,.txt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small{color:var(--dim)}
li.on b{color:var(--acc)}
.del{width:44px;color:var(--dim)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);padding:12px 16px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0002}
#seek{width:100%;accent-color:var(--acc)}
.row{display:flex;justify-content:space-around;align-items:center}
.row button{font-size:22px;min-width:56px}
.row .mode{font-size:14px;color:var(--dim)}
.row .mode[aria-pressed=true]{color:var(--acc);font-weight:700}
nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px}
nav button,#tools button{white-space:nowrap;background:var(--card);border-radius:22px;padding:0 16px}
nav button[aria-pressed=true]{background:var(--acc);color:var(--bg)}
#tools{display:flex;gap:8px;overflow-x:auto}
.alt{margin-top:8px;background:var(--card);color:var(--fg)}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--fg);width:min(90vw,360px);max-height:75vh}
dialog button{display:block;width:100%;text-align:left}
#full{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border-radius:0;background:var(--bg);text-align:center;padding:calc(8px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
#full>b,#full>small{display:block}
#art{width:min(100%,40vh);height:auto;aspect-ratio:1;margin:8px auto 16px;font-size:80px}
#fseek{width:100%;accent-color:var(--acc)}
#full .row button{width:auto;text-align:center}
#qlist li{text-align:left}#qlist span{flex:1}#full #qlist button{width:auto}
footer .txt{cursor:pointer}
</style>
</head>
<body>
<h1>Musica</h1>
<p id="info" role="status"></p>
<label class="btn">Importa brani
  <input id="pick" type="file" multiple hidden>
</label>
<label class="btn alt">Importa come playlist
  <input id="pickList" type="file" multiple hidden>
</label>
<input id="q" type="search" placeholder="Cerca titolo o artista" aria-label="Cerca">
<nav id="tabs" aria-label="Playlist"></nav>
<div id="tools"></div>
<ul id="list"></ul>

<dialog id="menu"></dialog>

<dialog id="full">
  <button id="close">Chiudi</button>
  <div id="art" class="cover"></div>
  <b id="ftitle"></b><small id="fby"></small>
  <input id="fseek" type="range" min="0" max="1000" value="0" aria-label="Posizione">
  <div class="row"><small id="t0">0:00</small><small id="t1">0:00</small></div>
  <div class="row"><button data-for="prev" aria-label="Precedente"></button><button data-for="play" aria-label="Riproduci o pausa"></button><button data-for="next" aria-label="Successivo"></button></div>
  <div class="row"><button class="mode" data-for="shuf"></button><button class="mode" data-for="rep"></button></div>
  <p>In coda</p><ul id="qlist"></ul>
</dialog>

<footer>
  <div class="txt"><b id="now">Nessun brano in riproduzione</b><small id="by">&nbsp;</small></div>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posizione">
  <div class="row">
    <button class="mode" id="shuf" aria-pressed="false">Casuale</button>
    <button id="prev" aria-label="Precedente">⏮︎</button>
    <button id="play" aria-label="Riproduci o pausa">▶︎</button>
    <button id="next" aria-label="Successivo">⏭︎</button>
    <button class="mode" id="rep" aria-pressed="false">Ripeti</button>
  </div>
</footer>
<audio id="audio" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
let db, tracks = [], current = null, url = null, upcoming = null, shuffle = false, repeat = false;

const wrap = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const store = (name, mode = 'readonly') => db.transaction(name, mode).objectStore(name);
let lists = [], view = 'all', context = [], queue = [];
let selected = null, mix = [], resumeAt = null, enriching = false;
const smart = {
  recent: ['Recenti', () => tracks.filter(t => t.last).sort((a, b) => b.last - a.last).slice(0, 30)],
  top: ['Più ascoltati', () => tracks.filter(t => t.plays).sort((a, b) => b.plays - a.plays).slice(0, 30)],
  mix: ['Mix casuale', () => mix.map(byId).filter(Boolean)]
};
const byId = id => tracks.find(t => t.id === id);
const listOf = () => lists.find(l => l.id === view);
const visible = () => {
  const q = $('q').value.toLowerCase(), l = listOf();
  const base = smart[view] ? smart[view][1]() : l ? l.ids.map(byId).filter(Boolean) : tracks;
  return base.filter(t => (t.title + ' ' + t.artist).toLowerCase().includes(q));
};
const button = (label, action, on) => {
  const b = document.createElement('button');
  b.textContent = label; b.onclick = action;
  if (on !== undefined) b.setAttribute('aria-pressed', on);
  return b;
};
async function save(l) {
  await wrap(store('lists', 'readwrite').put(l));
  render(); if (current) prepare();
}
async function create(ids = [], suggested = '') {
  const name = prompt('Nome della playlist', suggested)?.trim();
  if (!name) return;
  const l = { id: 'p' + Date.now(), name, ids };
  lists.push(l); view = l.id; await save(l);
}
function renderTabs() {
  const tab = (id, name) => button(name, () => {
    if (id === 'mix') mix = tracks.map(t => [Math.random(), t.id]).sort((a, b) => a[0] - b[0]).slice(0, 25).map(x => x[1]);
    view = id; selected = null; render();
  }, view === id);
  $('tabs').replaceChildren(tab('all', 'Tutti i brani'), ...Object.entries(smart).map(([id, [n]]) => tab(id, n)), ...lists.map(l => tab(l.id, l.name)), button('+ Nuova', () => create()));
  const l = listOf(), tools = [];
  if (visible().length) tools.push(button('Riproduci', () => { context = visible().map(t => t.id); start(visible()[0]); }));
  if (l && l.id !== 'fav') tools.push(
    button('Rinomina', () => { const n = prompt('Nuovo nome', l.name)?.trim(); if (n) { l.name = n; save(l); } }),
    button('Elimina playlist', async () => {
      if (!confirm('Eliminare la playlist? I brani restano in libreria.')) return;
      await wrap(store('lists', 'readwrite').delete(l.id));
      lists = lists.filter(x => x !== l); view = 'all'; render();
    }));
  if (visible().length) tools.push(button('Seleziona', () => { selected = new Set(); render(); }));
  if (selected) {
    const ids = () => [...selected];
    tools.splice(0, tools.length,
      button('Tutti', () => { visible().forEach(t => selected.add(t.id)); render(); }),
      button(`Aggiungi (${selected.size})`, () => addMany(ids())),
      ...(l ? [button('Togli', () => { l.ids = l.ids.filter(i => !selected.has(i)); selected = null; save(l); })] : []),
      button('Elimina', () => removeMany(ids())),
      button('Annulla', () => { selected = null; render(); }));
  }
  $('tools').replaceChildren(...tools);
}
function menu(t) {
  const d = $('menu'), l = listOf(), fav = lists[0];
  const item = (label, action) => button(label, () => { d.close(); action(); });
  const toggleIn = x => { x.ids = x.ids.includes(t.id) ? x.ids.filter(i => i !== t.id) : [...x.ids, t.id]; save(x); };
  const move = step => {
    const i = l.ids.indexOf(t.id), j = i + step;
    if (j < 0 || j >= l.ids.length) return;
    [l.ids[i], l.ids[j]] = [l.ids[j], l.ids[i]]; save(l);
  };
  const title = document.createElement('b'); title.textContent = t.title;
  d.replaceChildren(title,
    item('Riproduci dopo', () => { queue.push(t.id); showNow(); if (current) prepare(); }),
    item(fav.ids.includes(t.id) ? 'Togli dai preferiti' : 'Aggiungi ai preferiti', () => toggleIn(fav)),
    ...lists.slice(1).filter(x => x !== l).map(x => item((x.ids.includes(t.id) ? 'Togli da ' : 'Aggiungi a ') + x.name, () => toggleIn(x))),
    item('Aggiungi a una nuova playlist', () => create([t.id])),
    ...(l ? [item('Sposta su', () => move(-1)), item('Sposta giù', () => move(1))] : []),
    ...(l && l !== fav ? [item('Togli da questa playlist', () => toggleIn(l))] : []),
    item('Modifica titolo e artista', async () => {
      const n = prompt('Titolo', t.title)?.trim(), a = n && prompt('Artista', t.artist)?.trim();
      if (a) { Object.assign(t, { title: n, artist: a }); await wrap(store('tracks', 'readwrite').put(t)); await load(); }
    }),
    item('Elimina dalla libreria', () => remove(t)),
    item('Chiudi', () => {}));
  d.showModal();
}

async function init() {
  const open = indexedDB.open('musica', 2);
  open.onupgradeneeded = () => {
    const d = open.result, has = n => d.objectStoreNames.contains(n);
    if (!has('tracks')) d.createObjectStore('tracks', { keyPath: 'id' });
    if (!has('files')) d.createObjectStore('files');
    if (!has('lists')) d.createObjectStore('lists', { keyPath: 'id' });
  };
  db = await wrap(open);
  navigator.storage?.persist?.();
  await load();
}

async function load() {
  tracks = await wrap(store('tracks').getAll());
  const saved = await wrap(store('lists').getAll());
  const fav = saved.find(l => l.id === 'fav') || { id: 'fav', name: 'Preferiti', ids: [] };
  lists = [fav, ...saved.filter(l => l.id !== 'fav')];
  tracks.sort((a, b) => a.artist.localeCompare(b.artist) || a.title.localeCompare(b.title));
  const mb = tracks.reduce((s, t) => s + t.size, 0) / 1e6;
  $('info').textContent = tracks.length
    ? `Brani: ${tracks.length}, spazio usato: ${mb.toFixed(0)} MB`
    : 'La libreria è vuota. Importa i brani dall’app File.';
  render();
  enrich();
}

function render() {
  renderTabs();
  $('list').replaceChildren(...visible().map(t => {
    const li = document.createElement('li');
    li.className = t.id === current?.id ? 'on' : '';
    li.innerHTML = '<button class="song"><span class="cover"></span><span class="txt"><b></b><small></small></span></button><button class="del" aria-label="Opzioni">⋯</button>';
    paint(li.querySelector('.cover'), t);
    li.querySelector('b').textContent = t.title;
    li.querySelector('small').textContent = t.artist;
    li.querySelector('.song').onclick = () => { context = visible().map(x => x.id); start(t); };
    li.querySelector('.del').onclick = () => menu(t);
    if (selected) {
      const flip = () => { selected.delete(t.id) || selected.add(t.id); render(); };
      li.querySelector('.song').onclick = li.querySelector('.del').onclick = flip;
      li.querySelector('.del').textContent = selected.has(t.id) ? '✓' : '○';
      li.querySelector('.del').setAttribute('aria-label', 'Seleziona');
    }
    return li;
  }));
}

async function importFiles(input, asList) {
  const all = [...input.files].sort((a, b) => a.name.localeCompare(b.name, 'it', { numeric: true }));
  input.value = '';
  let failed = 0, ids = [], m3u = null;
  for (const file of all) {
    if (/\.m3u8?$/i.test(file.name)) { m3u = file; continue; }
    if (!/\.(flac|m4a|mp3|wav|aac|aiff?)$/i.test(file.name)) { failed++; continue; }
    const id = file.name + file.size;
    if (byId(id)) { ids.push(id); continue; }
    const parts = file.name.replace(/\.[^.]+$/, '').split(' - ');
    const artist = parts.length > 1 ? parts.shift().trim() : 'Artista sconosciuto';
    $('info').textContent = 'Importo ' + file.name;
    try {
      const tx = db.transaction(['tracks', 'files'], 'readwrite');
      tx.objectStore('files').put(file, id);
      tx.objectStore('tracks').put({ id, artist, title: parts.join(' - ').trim() || file.name, size: file.size });
      await new Promise((ok, ko) => { tx.oncomplete = ok; tx.onabort = () => ko(tx.error); });
      ids.push(id);
    } catch { failed++; }
  }
  await load();
  if (m3u) {
    const names = (await m3u.text()).split(/\r?\n/).filter(x => x.trim() && !x.startsWith('#')).map(x => x.trim().split(/[\\/]/).pop().normalize());
    ids = names.map(n => tracks.find(t => t.id.normalize().startsWith(n) && /^\d+$/.test(t.id.normalize().slice(n.length)))?.id).filter(Boolean);
  }
  if ((asList || m3u) && ids.length) await create([...new Set(ids)], m3u ? m3u.name.replace(/\.[^.]+$/, '') : '');
  if (failed) $('info').textContent += `. File non importati: ${failed}`;
}
$('pick').onchange = e => importFiles(e.target, false);
$('pickList').onchange = e => importFiles(e.target, true);

// Il brano successivo viene letto in anticipo, per passare avanti anche a schermo bloccato
function neighbour(step) {
  if (step > 0 && byId(queue[0])) return byId(queue[0]);
  const chosen = context.map(byId).filter(Boolean);
  const list = chosen.length ? chosen : tracks;
  if (!list.length) return null;
  const i = list.findIndex(t => t.id === current?.id);
  if (shuffle && list.length > 1) {
    const others = list.filter(t => t.id !== current?.id);
    return others[Math.random() * others.length | 0];
  }
  return list[(i + step + list.length) % list.length];
}

async function start(t, blob, at) {
  if (!t) return;
  blob = blob || await wrap(store('files').get(t.id));
  if (url) URL.revokeObjectURL(url);
  current = t; upcoming = null; resumeAt = at ?? null;
  if (queue[0] === t.id) queue.shift();
  audio.src = url = URL.createObjectURL(blob);
  if (at === undefined) {
    audio.play().catch(() => {});
    t.plays = (t.plays || 0) + 1; t.last = Date.now();
    store('tracks', 'readwrite').put(t);
  }
  render(); showNow(); prepare();
}

async function prepare() {
  const t = neighbour(1);
  if (t) upcoming = { t, blob: await wrap(store('files').get(t.id)) };
}

const next = () => upcoming ? start(upcoming.t, upcoming.blob) : start(neighbour(1));
const prev = () => audio.currentTime > 3 ? audio.currentTime = 0 : start(neighbour(-1));
const toggle = () => !current ? (context = visible().map(t => t.id), start(visible()[0])) : audio.paused ? audio.play() : audio.pause();

const remove = t => removeMany([t.id]);
function removeMany(ids) {
  if (!ids.length || !confirm(`Eliminare dalla libreria i brani scelti (${ids.length})?`)) return;
  const gone = new Set(ids), keep = a => a.filter(i => !gone.has(i));
  const tx = db.transaction(['tracks', 'files', 'lists'], 'readwrite');
  ids.forEach(i => { tx.objectStore('tracks').delete(i); tx.objectStore('files').delete(i); });
  lists.forEach(l => { l.ids = keep(l.ids); tx.objectStore('lists').put(l); });
  tx.oncomplete = async () => {
    queue = keep(queue); context = keep(context); upcoming = null; selected = null;
    if (gone.has(current?.id)) { audio.pause(); audio.removeAttribute('src'); current = null; }
    await load(); showNow(); if (current) prepare();
  };
}
function addMany(ids) {
  if (!ids.length) return;
  const d = $('menu');
  const item = (label, action) => button(label, async () => { d.close(); await action(); selected = null; render(); });
  d.replaceChildren(
    ...lists.map(l => item(l.name, () => { l.ids = [...new Set([...l.ids, ...ids])]; return save(l); })),
    item('Nuova playlist', () => create(ids)), button('Chiudi', () => d.close()));
  d.showModal();
}

$('play').onclick = toggle; $('next').onclick = next; $('prev').onclick = prev;
$('q').oninput = render;
$('shuf').onclick = e => { shuffle = !shuffle; e.target.setAttribute('aria-pressed', shuffle); prepare(); };
$('rep').onclick = e => { repeat = !repeat; audio.loop = repeat; e.target.setAttribute('aria-pressed', repeat); };
audio.onplay = () => $('play').textContent = '⏸︎';
audio.onpause = () => $('play').textContent = '▶︎';
audio.onended = next;
audio.ontimeupdate = () => $('seek').value = audio.currentTime / audio.duration * 1000 || 0;
$('seek').oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
if ('mediaSession' in navigator) {
  const m = navigator.mediaSession;
  m.setActionHandler('play', () => audio.play());
  m.setActionHandler('pause', () => audio.pause());
  m.setActionHandler('nexttrack', next);
  m.setActionHandler('previoustrack', prev);
}
// Copertine e informazioni lette dai file (FLAC, MP3, M4A)
const text = (b, enc = 'utf-8') => new TextDecoder(enc).decode(b).replace(/\0+$/, '').trim();
const bytes = async (f, a, n) => new Uint8Array(await f.slice(a, a + n).arrayBuffer());
const be = (b, i, n = 4) => b.slice(i, i + n).reduce((v, x) => v * 256 + x, 0);
async function readTags(file) {
  const out = {};
  try {
    const head = await bytes(file, 0, 10), sig = text(head.slice(0, 4));
    if (sig === 'fLaC') {
      for (let pos = 4, last = false; !last && pos < file.size;) {
        const h = await bytes(file, pos, 4), type = h[0] & 127, len = be(h, 1, 3);
        last = h[0] & 128;
        if (type === 4) {
          const b = await bytes(file, pos + 4, len), v = new DataView(b.buffer);
          let i = 4 + v.getUint32(0, true), n = v.getUint32(i, true); i += 4;
          while (n--) {
            const l = v.getUint32(i, true), [k, ...r] = text(b.slice(i + 4, i + 4 + l)).split('='); i += 4 + l;
            const key = { TITLE: 'title', ARTIST: 'artist', ALBUM: 'album' }[k.toUpperCase()];
            if (key) out[key] = r.join('=');
          }
        } else if (type === 6) {
          const b = await bytes(file, pos + 4, len);
          let i = 8 + be(b, 4); i += 4 + be(b, i) + 16;
          out.pic = new Blob([b.slice(i + 4, i + 4 + be(b, i))]);
        }
        pos += 4 + len;
      }
    } else if (sig.startsWith('ID3') && head[3] >= 3) {
      const sync = (b, i) => b[i] << 21 | b[i + 1] << 14 | b[i + 2] << 7 | b[i + 3];
      const tag = await bytes(file, 10, sync(head, 6)), v4 = head[3] === 4;
      let i = head[5] & 64 ? (v4 ? sync(tag, 0) : be(tag, 0) + 4) : 0;
      while (i + 10 <= tag.length && tag[i]) {
        const id = text(tag.slice(i, i + 4)), len = v4 ? sync(tag, i + 4) : be(tag, i + 4), b = tag.slice(i + 10, i + 10 + len);
        i += 10 + len;
        const key = { TIT2: 'title', TPE1: 'artist', TALB: 'album' }[id];
        if (key) out[key] = text(b.slice(1), b[0] === 1 ? (b[1] === 254 ? 'utf-16be' : 'utf-16le') : ['windows-1252', '', 'utf-16be', 'utf-8'][b[0]]);
        if (id === 'APIC') {
          let j = b.indexOf(0, 1) + 2;
          if (b[0] === 1 || b[0] === 2) { while (j + 1 < b.length && (b[j] || b[j + 1])) j += 2; j += 2; }
          else j = b.indexOf(0, j) + 1;
          out.pic = new Blob([b.slice(j)]);
        }
      }
    } else if (text(head.slice(4, 8)) === 'ftyp') {
      const walk = async (from, end) => {
        for (let p = from; p + 8 <= end;) {
          const h = await bytes(file, p, 16);
          let len = be(h, 0), off = 8;
          if (len === 1) { len = be(h, 8, 8); off = 16; }
          if (!len) len = end - p;
          if (len < off) break;
          const name = text(h.slice(4, 8), 'windows-1252');
          const key = { '©nam': 'title', '©ART': 'artist', '©alb': 'album', covr: 'pic' }[name];
          if (['moov', 'udta', 'ilst'].includes(name)) await walk(p + off, p + len);
          else if (name === 'meta') await walk(p + off + 4, p + len);
          else if (key) {
            const d = await bytes(file, p + off, len - off), v = d.slice(16, be(d, 0));
            out[key] = key === 'pic' ? new Blob([v]) : text(v);
          }
          p += len;
        }
      };
      await walk(0, file.size);
    }
  } catch {}
  return out;
}
async function shrink(pic) {
  try {
    const img = await createImageBitmap(pic), k = Math.min(1, 600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = img.width * k; c.height = img.height * k;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', .85));
  } catch { return null; }
}
async function enrich() {
  if (enriching) return;
  enriching = true;
  let t;
  while ((t = tracks.find(x => !x.tagged))) {
    t.tagged = true;
    const file = await wrap(store('files').get(t.id));
    if (!file) continue;
    const tags = await readTags(file);
    const parts = t.id.slice(0, -String(t.size).length).replace(/\.[^.]+$/, '').split(' - ');
    const artist = parts.length > 1 ? parts.shift().trim() : 'Artista sconosciuto';
    // Non sovrascrive titoli e artisti modificati a mano
    if (t.title === parts.join(' - ').trim() && t.artist === artist) { t.title = tags.title || t.title; t.artist = tags.artist || artist; }
    t.album = tags.album || '';
    if (tags.pic) t.cover = await shrink(tags.pic);
    await wrap(store('tracks', 'readwrite').put(t));
    render(); showNow();
  }
  enriching = false;
}

// Player a schermo intero
const covers = new Map();
function paint(el, t) {
  if (t?.cover) {
    if (!covers.has(t.id)) covers.set(t.id, URL.createObjectURL(t.cover));
    el.style.background = `center/cover url("${covers.get(t.id)}")`; el.textContent = '';
  } else {
    const hue = [...(t ? t.artist + t.title : '')].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 250);
    el.style.background = `hsl(${hue} 50% 42%)`; el.textContent = t ? t.title[0].toUpperCase() : '♪';
  }
}
function showNow() {
  const t = current && (byId(current.id) || current);
  $('now').textContent = $('ftitle').textContent = t ? t.title : 'Nessun brano in riproduzione';
  $('by').textContent = t ? t.artist : '';
  $('fby').textContent = t ? [t.artist, t.album].filter(Boolean).join(', ') : '';
  paint($('art'), t);
  if (t && 'mediaSession' in navigator)
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album || '', artwork: [{ src: t.cover ? covers.get(t.id) : 'icon.png' }] });
  $('qlist').replaceChildren(...queue.map((id, i) => {
    const li = document.createElement('li'), name = document.createElement('span');
    name.textContent = byId(id)?.title || '';
    const change = fn => () => { fn(); showNow(); if (current) prepare(); };
    li.append(name,
      button('↑', change(() => { if (i) [queue[i - 1], queue[i]] = [queue[i], queue[i - 1]]; })),
      button('✕', change(() => queue.splice(i, 1))));
    return li;
  }));
  sync();
}
function sync() {
  document.querySelectorAll('[data-for]').forEach(b => {
    const o = $(b.dataset.for);
    b.textContent = o.textContent;
    if (o.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', o.getAttribute('aria-pressed'));
  });
}
document.querySelectorAll('[data-for]').forEach(b => b.onclick = () => { $(b.dataset.for).click(); sync(); });
document.querySelector('footer .txt').onclick = () => { showNow(); $('full').showModal(); };
$('close').onclick = () => $('full').close();
$('fseek').oninput = $('seek').oninput;
const clock = s => isFinite(s) ? `${s / 60 | 0}:${String(s % 60 | 0).padStart(2, '0')}` : '0:00';

// Ripresa dell'ascolto
let savedAt = 0;
function remember() {
  if (!current || resumeAt !== null) return;
  try { localStorage.setItem('last', JSON.stringify({ id: current.id, time: audio.currentTime, context, queue })); } catch {}
}
async function restore() {
  let last;
  try { last = JSON.parse(localStorage.getItem('last')); } catch {}
  if (!last || !byId(last.id) || current) return;
  context = last.context || []; queue = last.queue || [];
  await start(byId(last.id), null, last.time);
}
audio.addEventListener('loadedmetadata', () => { if (resumeAt !== null) { audio.currentTime = resumeAt; resumeAt = null; } });
audio.addEventListener('timeupdate', () => {
  $('fseek').value = $('seek').value; $('t0').textContent = clock(audio.currentTime); $('t1').textContent = clock(audio.duration);
  if (Date.now() - savedAt > 5000) { savedAt = Date.now(); remember(); }
});
['play', 'pause'].forEach(e => audio.addEventListener(e, () => setTimeout(() => { sync(); remember(); })));
document.addEventListener('visibilitychange', remember);

navigator.serviceWorker?.register('sw.js');
init().then(restore).catch(() => $('info').textContent = 'Impossibile aprire la libreria. Disattiva la navigazione privata e riprova.');
</script>
</body>
</html>
